{% extends "base.html" %}
{% block title %}شخصی‌سازی{% endblock %}
{% block content %}
<div class="dashboard">
{% include "_sidebar.html" %}
<main class="main">
<header class="topbar">
  <h2>شخصی‌سازی</h2>
  <div class="topbar-actions"><button type="button" class="theme-toggle" id="themeToggle">🌓</button></div>
</header>
<div class="content">
  <div class="card">
    <div class="card-title">تم روشن / تیره</div>
    <div class="card-desc">در همه صفحات اعمال می‌شود</div>
    <div class="theme-grid">
      <div class="theme-option" data-theme="dark">تیره</div>
      <div class="theme-option" data-theme="light">روشن</div>
    </div>
  </div>
  <div class="card">
    <div class="card-title">رنگ اصلی پنل</div>
    <div class="card-desc">دکمه‌ها، هایلایت منو، نمودار و گرادیان پس‌زمینه با این رنگ هماهنگ می‌شوند</div>
    <div class="color-grid">
      <div class="color-swatch" data-color="blue" style="background:#3b82f6" title="آبی"></div>
      <div class="color-swatch" data-color="purple" style="background:#a855f7" title="بنفش"></div>
      <div class="color-swatch" data-color="green" style="background:#22c55e" title="سبز"></div>
      <div class="color-swatch" data-color="orange" style="background:#f59e0b" title="نارنجی"></div>
      <div class="color-swatch" data-color="pink" style="background:#ec4899" title="صورتی"></div>
      <div class="color-swatch" data-color="teal" style="background:#14b8a6" title="فیروزه‌ای"></div>
      <div class="color-swatch" data-color="red" style="background:#ef4444" title="قرمز"></div>
      <div class="color-swatch" data-color="indigo" style="background:#6366f1" title="ایندیگو"></div>
    </div>
  </div>
</div>
</main>
</div>
{% endblock %}
