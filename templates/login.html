{% extends "base.html" %}
{% block title %}ورود | پنل مدیریت فرنود{% endblock %}
{% block content %}
<div class="login-wrapper">
    <div class="login-card">
        <div class="login-header">
            <div class="logo-wrap">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="فرنود">
            </div>
            <h1>فرنود</h1>
            <p>ورود به پنل مدیریت</p>
        </div>
        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label for="username">نام کاربری</label>
                <input type="text" id="username" name="username" placeholder="نام کاربری" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">رمز عبور</label>
                <input type="password" id="password" name="password" placeholder="رمز عبور" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-primary">ورود</button>
        </form>
    </div>
</div>
{% endblock %}
