{% extends "base.html" %}
{% block title %}دسته‌بندی{% endblock %}
{% block content %}
<div class="dashboard">{% include "_sidebar.html" %}<main class="main">
<header class="topbar"><h2>دسته‌بندی محصولات</h2></header>
<div class="content">
<div class="card">
<form method="post" style="display:flex;gap:12px;flex-wrap:wrap;align-items:end">
<input type="hidden" name="action" value="add">
<div class="form-group" style="margin:0;flex:1"><label>نام دسته</label><input name="name" required></div>
<button class="btn-primary inline" type="submit">افزودن</button>
</form>
</div>
{% for c in categories %}
<div class="card">
<form method="post" style="display:grid;grid-template-columns:1.2fr .7fr .9fr .9fr auto auto;gap:10px;align-items:end">
<input type="hidden" name="action" value="edit">
<input type="hidden" name="cid" value="{{ c.id }}">
<div class="form-group" style="margin:0"><label>نام</label><input name="name" value="{{ c.name }}" required></div>
<div class="form-group" style="margin:0"><label>ایموجی عادی</label><input name="emoji" value="{{ c.emoji or '' }}" maxlength="16" placeholder="📁"></div>
<div class="form-group" style="margin:0"><label>ایموجی پریمیوم</label><input name="premium_emoji" value="{{ c.premium_emoji or '' }}" maxlength="64" placeholder="p_xxx"></div>
<div class="form-group" style="margin:0"><label>رنگ دکمه</label>
<select name="button_color">
<option value="none" {% if (c.button_color or 'none') not in ['blue','primary','green','success','red','danger'] %}selected{% endif %}>⚪ بی‌رنگ</option>
<option value="blue" {% if c.button_color in ['blue','primary'] %}selected{% endif %}>🔵 آبی</option>
<option value="green" {% if c.button_color in ['green','success'] %}selected{% endif %}>🟢 سبز</option>
<option value="red" {% if c.button_color in ['red','danger'] %}selected{% endif %}>🔴 قرمز</option>
</select>
</div>
<button class="btn-primary inline" type="submit">ذخیره</button>
</form>
<form method="post" onsubmit="return confirm('حذف؟')" style="margin-top:8px">
<input type="hidden" name="action" value="delete"><input type="hidden" name="cid" value="{{ c.id }}">
<button class="btn-danger" type="submit">حذف</button>
</form>
</div>
{% else %}<div class="empty"><p>دسته‌ای نیست</p></div>{% endfor %}
</div></main></div>
{% endblock %}
