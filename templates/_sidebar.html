<aside class="sidebar">
    <div class="sidebar-brand">
        <div class="logo-mini">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="فرنود">
        </div>
        <span class="brand-text">فرنود</span>
    </div>
    <nav class="nav">
        <a href="{{ url_for('dashboard') }}" class="nav-item {% if active == 'dashboard' %}active{% endif %}">
            <span>داشبورد</span>
        </a>
        <div class="nav-label">ربات</div>
        <a href="{{ url_for('bot_messages') }}" class="nav-item {% if active == 'bot_messages' %}active{% endif %}"><span>پیام خوش‌آمد</span></a>
        <a href="{{ url_for('messages_manage') }}" class="nav-item {% if active == 'messages' %}active{% endif %}"><span>پیام‌های کیف پول</span></a>
        <a href="{{ url_for('bot_users_list') }}" class="nav-item {% if active == 'bot_users' %}active{% endif %}"><span>کاربران ربات</span></a>
        <div class="nav-label">پرداخت</div>
        <a href="{{ url_for('cards_manage') }}" class="nav-item {% if active == 'cards' %}active{% endif %}"><span>کارت‌ها</span></a>
        <a href="{{ url_for('charges_list') }}" class="nav-item {% if active == 'charges' %}active{% endif %}"><span>درخواست شارژ</span></a>
        <a href="{{ url_for('gifts_manage') }}" class="nav-item {% if active == 'gifts' %}active{% endif %}"><span>کد هدیه</span></a>
        <div class="nav-label">VPN</div>
        <a href="{{ url_for('panels_list') }}" class="nav-item {% if active == 'panels' %}active{% endif %}"><span>مدیریت پنل‌ها</span></a>
        <div class="nav-label">سیستم</div>
        <a href="{{ url_for('personalize') }}" class="nav-item {% if active == 'personalize' %}active{% endif %}"><span>شخصی‌سازی</span></a>
    </nav>
    <div class="sidebar-footer">
        <div class="user-chip">
            <div class="avatar">{{ username[0] | upper }}</div>
            <div class="user-meta">
                <span class="name">{{ username }}</span>
                <span class="role">مدیر</span>
            </div>
        </div>
        <a href="{{ url_for('logout') }}" class="btn-logout" title="خروج">خروج</a>
    </div>
</aside>
