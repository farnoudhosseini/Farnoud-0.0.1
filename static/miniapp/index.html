<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#0b0b12">
  <title>مینی‌اپ فرنود</title>
  <style>
    @font-face{font-family:Vazirmatn;src:url(/miniapp/assets/fonts/Vazirmatn-Regular.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}
    @font-face{font-family:Vazirmatn;src:url(/miniapp/assets/fonts/Vazirmatn-Medium.woff2) format("woff2");font-weight:500;font-style:normal;font-display:swap}
    @font-face{font-family:Vazirmatn;src:url(/miniapp/assets/fonts/Vazirmatn-Bold.woff2) format("woff2");font-weight:700;font-style:normal;font-display:swap}
  </style>
  <link rel="stylesheet" href="/miniapp/assets/app.css?v=10">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" id="brandMark">F</div>
        <div>
          <strong id="brandName">فرنود</strong>
          <small id="brandSub">مدیریت سرویس VPN</small>
        </div>
      </div>
      <button class="icon-btn" id="notifyBtn" type="button" aria-label="اعلان‌ها"><b id="notifyBadge" hidden>0</b></button>
    </header>

    <main id="app" class="content">
      <section class="skeleton-page" id="loading">
        <div class="sk hero"></div>
        <div class="sk line"></div>
        <div class="sk line short"></div>
        <div class="sk card"></div>
      </section>
    </main>

    <nav class="bottom-nav">
      <button type="button" data-tab="home" class="active"><span class="nav-ico"></span><small>خانه</small></button>
      <button type="button" data-tab="services"><span class="nav-ico"></span><small>سرویس‌ها</small></button>
      <button type="button" data-tab="wallet"><span class="nav-ico"></span><small>کیف پول</small></button>
      <button type="button" data-tab="rewards"><span class="nav-ico"></span><small>باشگاه</small></button>
      <button type="button" data-tab="profile"><span class="nav-ico"></span><small>پروفایل</small></button>
    </nav>
  </div>

  <div id="toast" class="toast" role="status"></div>
  <div id="sheet" class="sheet-backdrop" hidden aria-hidden="true">
    <div class="sheet">
      <button type="button" class="sheet-close" id="sheetClose">×</button>
      <div id="sheetContent"></div>
    </div>
  </div>

  <div id="busyOverlay" class="busy-overlay" hidden aria-hidden="true">
    <div class="busy-card">
      <div class="busy-spinner"></div>
      <div class="busy-title" id="busyTitle">در حال انجام...</div>
      <div class="busy-bar"><i id="busyBar"></i></div>
      <div class="busy-sub" id="busySub">لطفاً صبر کنید</div>
    </div>
  </div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/miniapp/assets/app.js?v=10"></script>
</body>
</html>
